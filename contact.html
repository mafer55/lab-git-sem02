<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>

<body style="font-family:Arial, sans-serif; background:#f5f1f7; color:#2d2a32; margin:0; padding:30px;">

    <main style="max-width:900px; margin:auto; background:white; padding:30px; border-radius:18px;">

        <nav style="background:#2d2a32; padding:15px; border-radius:12px; margin-bottom:25px;">
            <a href="index.html" style="color:white; margin-right:20px; text-decoration:none;">Inicio</a>
            <a href="about.html" style="color:white; margin-right:20px; text-decoration:none;">Guía</a>
            <a href="contact.html" style="color:white; text-decoration:none; font-weight:bold;">Contacto</a>
        </nav>

        <h1 style="color:#7b4b94;">
            Cuéntanos tu experiencia
        </h1>

        <p>
            ¿Qué es lo más difícil de tu carrera?
            Puedes dejar un mensaje:
        </p>

        <form>

            <label for="nombre">
                <strong>Nombre:</strong>
            </label>
            <br>

            <input
                id="nombre"
                type="text"
                placeholder="Escribe tu nombre"
                style="width:95%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:8px;"
            >

            <br>

            <label for="correo">
                <strong>Correo:</strong>
            </label>
            <br>

            <input
                id="correo"
                type="email"
                placeholder="ejemplo@correo.com"
                style="width:95%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:8px;"
            >

            <br>

            <label for="mensaje">
                <strong>Mensaje:</strong>
            </label>
            <br>

            <textarea
                id="mensaje"
                rows="6"
                placeholder="Cuéntanos qué está pasando..."
                style="width:95%; padding:10px; margin:8px 0 15px; border:1px solid #ccc; border-radius:8px;"
            ></textarea>

            <br>

            <button
                type="submit"
                style="background:#7b4b94; color:white; border:0; padding:12px 22px; border-radius:8px; cursor:pointer;"
            >
                Enviar
            </button>

        </form>

    </main>

</body>
</html>
